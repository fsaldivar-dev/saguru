# XcodeGen spec of Saguru's companion app for the iPhone. SaguruCamara.xcodeproj is generated from this file
# (run `xcodegen` in this folder), so change settings here, not in Xcode.
# The app sends the iPhone's camera to Saguru over the USB cable: no Wi-Fi and no iCloud account involved.
name: SaguruCamara
options:
  bundleIdPrefix: dev.saguru
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SaguruCamara:
    type: application
    platform: iOS
    sources:
      - path: SaguruCamara
    info:
      path: SaguruCamara/Info.plist
      properties:
        CFBundleDisplayName: Saguru Cámara
        NSCameraUsageDescription: "La cámara se envía por el cable USB a Saguru, en tu Mac, para usarla como cámara del simulador."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.saguru.camara
